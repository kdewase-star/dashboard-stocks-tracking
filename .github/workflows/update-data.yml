name: Update Market Data

on:
  workflow_dispatch:
  schedule:
    - cron: "2-57/5 * * * 1-5"

permissions:
  contents: write

concurrency:
  group: market-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "nse[server]" requests

      - name: Update market data
        run: |
          python updater.py

      - name: Update IPO data
        run: |
          python ipo_updater.py

      - name: Validate generated data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("data.json").read_text(encoding="utf-8"))
          ipo = json.loads(Path("ipo.json").read_text(encoding="utf-8"))

          if not isinstance(data, dict):
              raise SystemExit("ERROR: data.json is not an object")

          if not isinstance(data.get("stocks", {}), (dict, list)):
              raise SystemExit("ERROR: data.json stocks is invalid")

          if not isinstance(ipo.get("ipos", []), list):
              raise SystemExit("ERROR: ipo.json ipos is invalid")

          print("Market updated:", data.get("updatedAt"))
          print("Stock failures:", data.get("stockFailures", []))
          print("IPO updated:", ipo.get("updatedAt"))
          print("IPO count:", len(ipo.get("ipos", [])))
          PY

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json ipo.json history-cache.json nse_cache

          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update market and IPO data"
            git push
          fi

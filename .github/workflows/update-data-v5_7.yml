name: Update market data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * 1-5"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install NSE and BSE clients
        run: python -m pip install --upgrade pip "nse[server]" bse requests

      - name: Fetch delayed market data
        run: python updater.py

      - name: Commit data snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json nse_cache bse_cache || true
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update market data"
            git push
          fi
